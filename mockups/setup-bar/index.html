<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Start · setup bar mockup</title>
  <meta name="color-scheme" content="light dark">
  <!-- The real stylesheet and card/layout modules, so cards look and pack exactly as on tab1.net.
       Serve the repo root (see .claude/launch.json "mockups") and open /mockups/setup-bar/. -->
  <link rel="stylesheet" href="/public/style.css">
  <link rel="stylesheet" href="setup-bar.css">
  <script type="module" src="setup-bar.js"></script>
</head>
<body class="has-backdrop" data-tab="home">
  <img class="backdrop" alt="" decoding="async">
  <header class="masthead">
    <div class="wrap">
      <div class="title">
        <span class="brand">Start</span>
        <span class="date">Monday 9 November</span>
        <button class="refresh" type="button" title="Refresh all feeds now" aria-label="Refresh all feeds now"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M13.5 2.5v3h-3"/></svg></button>
        <button class="customise-open" type="button" aria-expanded="false" aria-controls="setup-bar" title="Choose your topics and sources">
          <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M2.5 4h11M2.5 8h11M2.5 12h11"/><circle cx="5.5" cy="4" r="1.6" fill="currentColor"/><circle cx="10.5" cy="8" r="1.6" fill="currentColor"/><circle cx="7" cy="12" r="1.6" fill="currentColor"/></svg>
          <span>Customise</span>
        </button>
      </div>
      <form class="search" action="https://www.google.com/search" method="get" target="_blank" role="search">
        <input type="search" name="q" placeholder="Search Google" aria-label="Search Google" autocomplete="off">
      </form>
      <div class="weather-slot"></div>
    </div>
  </header>

  <div class="setup-bar-wrap wrap" id="setup-bar" hidden></div>

  <main class="wrap grid"></main>

  <div class="sb-toast" role="status" aria-live="polite" hidden></div>
  <nav class="review" aria-label="Mockup states" hidden></nav>
</body>
</html>
