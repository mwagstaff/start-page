name: Tab1
options:
  bundleIdPrefix: tab1.dev
  deploymentTarget:
    iOS: '26.2'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'
    DEVELOPMENT_TEAM: SJ8X4DLAN9
    CODE_SIGN_STYLE: Automatic
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 9.0.0
targets:
  Tab1:
    type: application
    platform: iOS
    dependencies:
      - package: GoogleSignIn
    entitlements:
      path: Tab1/Tab1.entitlements
      properties:
        aps-environment: development
        com.apple.developer.applesignin: [Default]
    sources:
      - path: Tab1
      - path: ../website/public/forecast.js
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tab1.dev.skynolimit
        TAB1_SIGN_STYLE: Automatic
        CODE_SIGN_STYLE: "$(TAB1_SIGN_STYLE)"
        PROVISIONING_PROFILE_SPECIFIER: "$(TAB1_PROFILE)"
        TARGETED_DEVICE_FAMILY: '1,2'
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: Tab1/Info.plist
      properties:
        CFBundleDisplayName: tab1
        CFBundleShortVersionString: '1.0'
        CFBundleVersion: '1'
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocationWhenInUseUsageDescription: Show and save the forecast for your approximate location.
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSCameraUsageDescription: Scan a QR code from tab1 to connect your settings.
        NSLocalNetworkUsageDescription: Connect to your tab1 development server for testing.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        BGTaskSchedulerPermittedIdentifiers: [tab1.dev.skynolimit.refresh, tab1.dev.skynolimit.processing]
        UIBackgroundModes: [fetch, processing, remote-notification]
        CFBundleURLTypes:
          - CFBundleURLSchemes: [tab1]
          - CFBundleURLSchemes: ['com.googleusercontent.apps.198958053443-cioa249m5haidthm825uovm3ikbbba33']
    scheme:
      testTargets: [Tab1UITests]

  Tab1UITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tab1UITests]
    dependencies:
      - target: Tab1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tab1.dev.skynolimit.uitests
        GENERATE_INFOPLIST_FILE: YES
